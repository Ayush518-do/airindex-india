services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      # Off unless explicitly set on the host: DEMO_MODE=1 docker compose up -d backend
      DEMO_MODE: "${DEMO_MODE:-0}"
    env_file:
      - path: .env
        required: false
    volumes:
      # Live-reload source + reuse the SQLite store / snapshots already on the host,
      # so the container serves the same data `python -m pipeline.run_all` built locally.
      - ./backend:/app/backend
      - ./pipeline:/app/pipeline
      - ./data:/app/data
    command:
      [
        "python", "-m", "uvicorn", "backend.main:app",
        "--host", "0.0.0.0", "--port", "8000",
        "--reload", "--reload-dir", "backend", "--reload-dir", "pipeline",
      ]

  # Daily scrape -> pipeline -> alerts, plus the monthly MoSPI refresh.
  # Shares ./data with the API, so the API serves whatever this collects.
  # Opt-in (profile) so a plain `docker compose up` never starts a second
  # scheduler alongside the Windows Task Scheduler one — two schedulers would
  # scrape every site twice. Start it explicitly:
  #   docker compose --profile scheduler up -d scheduler
  scheduler:
    profiles: ["scheduler"]
    build:
      context: .
      dockerfile: scraper/Dockerfile
    environment:
      DEMO_MODE: "0"
      TZ: Asia/Kolkata
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./pipeline:/app/pipeline
      - ./scraper:/app/scraper
    restart: unless-stopped
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: "1gb"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      # The browser (not the container) calls this, so it must be a host-reachable URL.
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    # Vite reads stdin for its interactive shortcuts and shuts down on EOF,
    # which kills the dev server in a detached container. Feed it a pipe that
    # never closes (and isn't a TTY, so shortcut mode stays off).
    command: ["sh", "-c", "tail -f /dev/null | npx vite --host 0.0.0.0"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
